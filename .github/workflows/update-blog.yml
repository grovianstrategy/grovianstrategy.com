name: Daily Blog Update

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 오전 9시 (한국시간 KST = UTC+9)
  workflow_dispatch:       # Actions 탭에서 수동 실행 가능

jobs:
  update-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch blog content from NewsAPI
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node scripts/fetch-blog.js

      - name: Commit and push blog-data.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blog-data.json
          git diff --staged --quiet || git commit -m "📰 Blog update $(date +'%Y-%m-%d')"
          git push
