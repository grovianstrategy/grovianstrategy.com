name: Daily Blog Update

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 오전 9시 (한국 시간 UTC+9)
  workflow_dispatch:       # 수동 실행도 가능

jobs:
  update-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch blog content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-blog.js

      - name: Commit and push blog data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add blog-data.json
          git diff --staged --quiet || git commit -m "📰 Daily blog update $(date +'%Y-%m-%d')"
          git push
